<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Set the theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme')
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = t
        } catch (e) {}
      })()
    </script>

    <title>Saurabh Girase — Full-Stack Developer</title>
    <meta
      name="description"
      content="The portfolio of Saurabh Girase, a full-stack developer building web and mobile products in React, React Native, and Node.js. Selected work, field notes, and case studies."
    />
    <meta name="author" content="Saurabh Girase" />
    <meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15120D" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph / social share -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Saurabh Girase" />
    <meta property="og:title" content="Saurabh Girase — Full-Stack Developer" />
    <meta
      property="og:description"
      content="A portfolio set like a magazine feature. Selected work, field notes, and case studies."
    />
    <meta property="og:image" content="/headshot.png" />
    <meta property="og:image:alt" content="Portrait of Saurabh Girase" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Saurabh Girase — Full-Stack Developer" />
    <meta
      name="twitter:description"
      content="Full-stack developer building web and mobile products in React, React Native, and Node.js."
    />
    <meta name="twitter:image" content="/headshot.png" />

    <!--
      Fraunces is the display face used in the masthead / first frame.
      @fontsource-variable/fraunces is imported in index.css, which Vite
      fingerprints at build time, so a hard-coded preload href would go stale.
      Self-hosted woff2 + font-display:swap keeps first paint fast without it.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
